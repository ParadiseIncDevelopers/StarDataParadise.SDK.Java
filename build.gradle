import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

if (gradle.gradleVersion != '9.3.1') throw new GradleException('Use Gradle 9.3.1.')

group = 'io.github.paradiseincdevelopers'
version = '0.3.0'
layout.buildDirectory = layout.projectDirectory.dir('out/build')

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withJavadocJar()
}

// The SDK license is distributed with every binary and documented in the POM.
// Do not silently substitute the Server (MIT) license for the Java SDK.
def sdkLicenseName = 'StarDataParadise SDK Free-Use License 1.0'
def sdkLicenseUrl = 'https://github.com/ParadiseIncDevelopers/StarDataParadise.SDK.Java/blob/master/LICENSE'
def signRelease = providers.gradleProperty('sdpSign').map { it.toBoolean() }.getOrElse(false)
if (!file('LICENSE').isFile()) throw new GradleException('SDK LICENSE file is required.')

def dependencyRoot = providers.gradleProperty('sdpDependencyDir')
        .orElse(providers.environmentVariable('SDP_SDK_DEPS'))
        .orNull
if (dependencyRoot == null) throw new GradleException('Set SDP_SDK_DEPS to the directory with verified JARs.')

def locked = { String name, String digest ->
    def jar = new File(dependencyRoot, name)
    if (!jar.isFile()) throw new GradleException("Missing verified dependency " + name)
    def sha = MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
    if (sha != digest) throw new GradleException("Dependency checksum mismatch for " + name)
    return jar
}

def gsonJar = locked('gson-2.13.2.jar', 'dd0ce1b55a3ed2080cb70f9c655850cda86c206862310009dcb5e5c95265a5e0')
def junitJar = locked('junit-platform-console-standalone-1.13.4.jar',
        '3fdfc37e29744a9a67dd5365e81467e26fbde0b7aa204e6f8bbe79eeaa7ae892')

repositories {
    flatDir {
        dirs dependencyRoot
        content { includeModule('com.google.code.gson', 'gson') }
    }
}

dependencies {
    api 'com.google.code.gson:gson:2.13.2'
    testImplementation files(junitJar)
    testRuntimeOnly files(junitJar)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar) {
    from('LICENSE') { into('META-INF') }
    manifest {
        attributes('Implementation-Version': project.version,
                'Implementation-Title': 'StarDataParadise JDBC Driver',
                'Automatic-Module-Name': 'com.stardataparadise.sdk')
    }
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from('LICENSE') { into('META-INF') }
    from('publishing/SOURCES_README.md') { rename { 'README.md' } }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped' }
}

sourceSets {
    smoke {
        compileClasspath += files(tasks.named('jar'))
    }
    installed {
        compileClasspath += files(tasks.named('jar'), gsonJar)
        runtimeClasspath += files(tasks.named('jar'), gsonJar)
    }
}

tasks.register('installedConsumerJar', Jar) {
    dependsOn tasks.named('installedClasses')
    from sourceSets.installed.output
    archiveClassifier = 'installed-consumer'
}

tasks.register('smoke', JavaExec) {
    dependsOn tasks.named('smokeClasses')
    classpath = sourceSets.smoke.output + files(tasks.named('jar'))
    mainClass = 'com.stardataparadise.sdk.smoke.Smoke'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

publishing {
    publications {
        sdk(MavenPublication) {
            from components.java
            artifact tasks.named('sourcesJar')
            artifactId = 'stardataparadise-jdbc'
            pom {
                name = 'StarDataParadise JDBC'
                description = 'Java 17 JDBC driver for StarDataParadise Server wire v1'
                url = 'https://github.com/ParadiseIncDevelopers/StarDataParadise.SDK.Java'
                if (sdkLicenseName && sdkLicenseUrl) {
                    licenses {
                        license {
                            name = sdkLicenseName
                            url = sdkLicenseUrl
                            distribution = 'repo'
                        }
                    }
                }
                developers {
                    developer {
                        id = 'ParadiseIncDevelopers'
                        name = 'ParadiseIncDevelopers'
                        url = 'https://github.com/ParadiseIncDevelopers'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/ParadiseIncDevelopers/StarDataParadise.SDK.Java.git'
                    developerConnection = 'scm:git:ssh://git@github.com/ParadiseIncDevelopers/StarDataParadise.SDK.Java.git'
                    url = 'https://github.com/ParadiseIncDevelopers/StarDataParadise.SDK.Java'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sdkArtifacts'
            url = layout.projectDirectory.dir('out/maven')
        }
    }
}

if (signRelease) {
    signing {
        useGpgCmd()
        sign publishing.publications.sdk
    }
}

def centralRepositoryPath = "${project.group.toString().replace('.', '/')}/stardataparadise-jdbc/${project.version}"
def centralBaseName = "stardataparadise-jdbc-${project.version}"
def centralPayloads = ['.jar', '.pom', '-sources.jar', '-javadoc.jar', '.module'].collect { centralBaseName + it }
def centralFiles = centralPayloads.collectMany { name ->
    ['', '.asc', '.md5', '.sha1'].collect { suffix -> "${centralRepositoryPath}/${name}${suffix}" }
}

def validateCentralRelease = tasks.register('validateCentralRelease') {
    doLast {
        if (!signRelease) {
            throw new GradleException('Central uploads require -PsdpSign=true, an approved SDK license and GPG signing; see PUBLISHING.md.')
        }
    }
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Builds the signed Maven Central upload ZIP; requires an approved license and local GPG key.'
    dependsOn validateCentralRelease, tasks.named('check'), tasks.named('publishSdkPublicationToSdkArtifactsRepository')
    archiveFileName = "${centralBaseName}-central.zip"
    destinationDirectory = layout.projectDirectory.dir('out/central')
    from(layout.projectDirectory.dir('out/maven')) { include centralFiles }
    doFirst {
        def missing = centralFiles.findAll { !layout.projectDirectory.file("out/maven/${it}").asFile.isFile() }
        if (missing) throw new GradleException('Missing Central bundle files: ' + missing.join(', '))
    }
}

tasks.named('check') { dependsOn tasks.named('installedConsumerJar'), tasks.named('smoke') }
